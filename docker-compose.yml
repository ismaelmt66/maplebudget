services:
  db:
    image: postgres:16-alpine
    container_name: nexleger_db
    environment:
      POSTGRES_DB: nexleger
      POSTGRES_USER: nexleger
      POSTGRES_PASSWORD: nexleger
    ports:
      - "5432:5432"
    volumes:
      - nexleger_db_data:/var/lib/postgresql/data

volumes:
  nexleger_db_data:
